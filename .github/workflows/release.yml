name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to build and publish (e.g. v1.2.1)'
        required: true
        type: string
      draft:
        description: 'Create draft release?'
        type: boolean
        default: false
      prerelease:
        description: 'Mark as pre-release?'
        type: boolean
        default: false

# Read-only by default; only the publish job may write to the repository
permissions:
  contents: read

env:
  # Inputs are passed through env, never pasted into scripts
  RELEASE_TAG: ${{ github.event.inputs.tag_name || github.ref_name }}

jobs:
  # ==============================================================
  # 1. Desktop Build (Windows NSIS Installer & Portable Executable)
  # ==============================================================
  build-desktop:
    name: Build Desktop (Windows x64)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.5.1

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run typecheck
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: Generate Desktop assets & binaries
        run: |
          node apps/desktop/scripts/make-icon.mjs
          node apps/desktop/scripts/fetch-binaries.mjs

      # Azure Trusted Signing, switched on by setting the AZURE_* secrets and variables below.
      # Signed builds also make electron-updater check the publisher of every downloaded update.
      - name: Configure Windows code signing
        shell: bash
        env:
          AZURE_SIGN_ENDPOINT: ${{ vars.AZURE_SIGN_ENDPOINT }}
          AZURE_SIGN_ACCOUNT: ${{ vars.AZURE_SIGN_ACCOUNT }}
          AZURE_SIGN_PROFILE: ${{ vars.AZURE_SIGN_PROFILE }}
          AZURE_SIGN_PUBLISHER: ${{ vars.AZURE_SIGN_PUBLISHER }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        run: |
          if [ -z "$AZURE_SIGN_ENDPOINT" ] || [ -z "$AZURE_CLIENT_ID" ]; then
            echo "::warning::Windows builds are unsigned (SmartScreen will warn). Set the AZURE_SIGN_* variables and AZURE_* secrets to sign them."
            exit 0
          fi
          for v in AZURE_SIGN_ACCOUNT AZURE_SIGN_PROFILE AZURE_SIGN_PUBLISHER; do
            if [ -z "${!v}" ]; then echo "::error::$v is not set"; exit 1; fi
          done
          # Insert under the existing "win:" key of electron-builder.yml (JSON strings are valid YAML)
          node -e '
            const fs = require("fs");
            const p = "apps/desktop/electron-builder.yml";
            const q = (k) => JSON.stringify(process.env[k]);
            const block = [
              "win:",
              "  azureSignOptions:",
              `    publisherName: ${q("AZURE_SIGN_PUBLISHER")}`,
              `    endpoint: ${q("AZURE_SIGN_ENDPOINT")}`,
              `    codeSigningAccountName: ${q("AZURE_SIGN_ACCOUNT")}`,
              `    certificateProfileName: ${q("AZURE_SIGN_PROFILE")}`,
            ].join("\n");
            const yml = fs.readFileSync(p, "utf8");
            if (!/^win:$/m.test(yml)) throw new Error("electron-builder.yml has no win: key");
            fs.writeFileSync(p, yml.replace(/^win:$/m, () => block));
          '

      - name: Build Electron Desktop Package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: pnpm --filter grabbit-desktop dist

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-artifacts
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/latest.yml
            apps/desktop/release/*.blockmap
          if-no-files-found: error

  # ==============================================================
  # 2. Mobile Build (Android APK via Expo & Gradle)
  # ==============================================================
  build-mobile:
    name: Build Mobile (Android APK)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.5.1

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck & test Mobile
        run: |
          pnpm --filter @grabbit/mobile typecheck
          pnpm --filter @grabbit/mobile test

      - name: Generate Mobile assets
        run: node apps/mobile/scripts/make-assets.mjs

      - name: Prebuild Native Android Project
        run: pnpm --filter @grabbit/mobile exec expo prebuild --platform android --clean

      # Without this key Gradle signs with the public debug key, and anyone could then sign an
      # APK that Android installs as an update over GRabbit. See docs/RELEASING.md.
      - name: Prepare Android release key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::The ANDROID_KEYSTORE_BASE64 secret is not set. Release APKs must be signed with the GRabbit upload key (see docs/RELEASING.md)."
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/grabbit-upload.jks"
          echo "GRABBIT_UPLOAD_STORE_FILE=$RUNNER_TEMP/grabbit-upload.jks" >> "$GITHUB_ENV"

      - name: Assemble Release APK
        env:
          GRABBIT_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          GRABBIT_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          GRABBIT_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd apps/mobile/android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Verify APK is not debug-signed
        run: |
          APK_PATH=$(find apps/mobile/android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)/apksigner"
          CERTS=$("$APKSIGNER" verify --print-certs "$APK_PATH")
          echo "$CERTS"
          if echo "$CERTS" | grep -qi "CN=Android Debug"; then
            echo "::error::The APK is signed with the Android debug key"
            exit 1
          fi
          rm -f "$RUNNER_TEMP/grabbit-upload.jks"

      - name: Prepare APK Artifact
        id: prepare-apk
        run: |
          VERSION="${RELEASE_TAG#v}"
          mkdir -p dist-apk
          APK_PATH=$(find apps/mobile/android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: No APK found!"
            exit 1
          fi
          echo "Found APK: $APK_PATH"
          cp "$APK_PATH" "dist-apk/GRabbit-v${VERSION}.apk"
          cp "$APK_PATH" "dist-apk/GRabbit-Android-release.apk"

      - name: Upload Mobile Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mobile-artifacts
          path: dist-apk/*.apk
          if-no-files-found: error

  # ==============================================================
  # 3. Browser Extension Build (Chrome / Edge / Firefox MV3 ZIP)
  # ==============================================================
  build-extension:
    name: Build Chrome Extension (MV3)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.5.1

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Extension Icons & Build Extension
        run: |
          node apps/desktop/scripts/make-icon.mjs
          pnpm --filter @grabbit/extension typecheck
          pnpm --filter @grabbit/extension test
          pnpm --filter @grabbit/extension build

      - name: Package Extension ZIP
        run: |
          VERSION="${RELEASE_TAG#v}"
          mkdir -p dist-extension
          cd packages/extension/dist
          zip -r "../../../dist-extension/GRabbit-Chrome-Extension-v${VERSION}.zip" .
          cp "../../../dist-extension/GRabbit-Chrome-Extension-v${VERSION}.zip" "../../../dist-extension/GRabbit-Chrome-Extension.zip"

      - name: Upload Extension Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: extension-artifacts
          path: dist-extension/*.zip
          if-no-files-found: error

  # ==============================================================
  # 4. Publish Unified GitHub Release
  # ==============================================================
  publish-release:
    name: Publish Release to GitHub
    needs: [build-desktop, build-mobile, build-extension]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Desktop Artifacts
        uses: actions/download-artifact@v4
        with:
          name: desktop-artifacts
          path: release-assets/desktop

      - name: Download Mobile Artifacts
        uses: actions/download-artifact@v4
        with:
          name: mobile-artifacts
          path: release-assets/mobile

      - name: Download Extension Artifacts
        uses: actions/download-artifact@v4
        with:
          name: extension-artifacts
          path: release-assets/extension

      - name: Compute Checksums & Structure Assets
        run: |
          set -euo pipefail
          mkdir -p release-files
          # Every platform must be present: a missing file fails the release instead of shipping without it
          cp release-assets/desktop/*.exe release-files/
          cp release-assets/desktop/latest.yml release-files/
          cp release-assets/desktop/*.blockmap release-files/
          cp release-assets/mobile/*.apk release-files/
          cp release-assets/extension/*.zip release-files/

          cd release-files
          sha256sum -- * > ../SHA256SUMS.txt
          mv ../SHA256SUMS.txt .
          sha256sum --check --quiet SHA256SUMS.txt
          echo "Generated SHA256 checksums:"
          cat SHA256SUMS.txt

      - name: Determine Release Tag
        id: get_tag
        run: |
          TAG="$RELEASE_TAG"
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+[.][0-9]+[.][0-9]+([-.][0-9A-Za-z.-]+)?$'; then
            echo "Error: '$TAG' is not a release tag like v1.2.3" >&2
            exit 1
          fi
          echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Clean Conflicting Release Assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.get_tag.outputs.release_tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            for asset in $(gh release view "$TAG" --json assets -q '.assets[].name'); do
              gh release delete-asset "$TAG" "$asset" --yes || true
            done
          fi

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_tag.outputs.release_tag }}
          name: "GRabbit ${{ steps.get_tag.outputs.release_tag }}"
          draft: ${{ github.event.inputs.draft || false }}
          prerelease: ${{ github.event.inputs.prerelease || false }}
          generate_release_notes: true
          files: |
            release-files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

