name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'
      draft:
        description: 'Create draft release?'
        type: boolean
        default: false
      prerelease:
        description: 'Mark as pre-release?'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # ==============================================================
  # 1. Desktop Build (Windows NSIS Installer & Portable Executable)
  # ==============================================================
  build-desktop:
    name: Build Desktop (Windows x64)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.5.1

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Run typecheck
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: Generate Desktop assets & binaries
        run: |
          node apps/desktop/scripts/make-icon.mjs
          node apps/desktop/scripts/fetch-binaries.mjs

      - name: Build Electron Desktop Package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm --filter grabbit-desktop dist

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-artifacts
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/latest.yml
            apps/desktop/release/*.blockmap
          if-no-files-found: error

  # ==============================================================
  # 2. Mobile Build (Android APK via Expo & Gradle)
  # ==============================================================
  build-mobile:
    name: Build Mobile (Android APK)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.5.1

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Generate Mobile assets
        run: node apps/mobile/scripts/make-assets.mjs

      - name: Prebuild Native Android Project
        run: pnpm --filter @grabbit/mobile exec expo prebuild --platform android --clean

      - name: Assemble Release APK
        run: |
          cd apps/mobile/android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Prepare APK Artifact
        id: prepare-apk
        run: |
          VERSION="${{ github.event.inputs.tag_name || github.ref_name }}"
          VERSION="${VERSION#v}"
          mkdir -p dist-apk
          APK_PATH=$(find apps/mobile/android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: No APK found!"
            exit 1
          fi
          echo "Found APK: $APK_PATH"
          cp "$APK_PATH" "dist-apk/GRabbit-v${VERSION}.apk"
          cp "$APK_PATH" "dist-apk/GRabbit-Android-release.apk"

      - name: Upload Mobile Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mobile-artifacts
          path: dist-apk/*.apk
          if-no-files-found: error

  # ==============================================================
  # 3. Browser Extension Build (Chrome / Edge / Firefox MV3 ZIP)
  # ==============================================================
  build-extension:
    name: Build Chrome Extension (MV3)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.5.1

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Generate Extension Icons & Build Extension
        run: |
          node apps/desktop/scripts/make-icon.mjs
          pnpm --filter @grabbit/extension typecheck
          pnpm --filter @grabbit/extension test
          pnpm --filter @grabbit/extension build

      - name: Package Extension ZIP
        run: |
          VERSION="${{ github.event.inputs.tag_name || github.ref_name }}"
          VERSION="${VERSION#v}"
          mkdir -p dist-extension
          cd packages/extension/dist
          zip -r "../../../dist-extension/GRabbit-Chrome-Extension-v${VERSION}.zip" .
          cp "../../../dist-extension/GRabbit-Chrome-Extension-v${VERSION}.zip" "../../../dist-extension/GRabbit-Chrome-Extension.zip"

      - name: Upload Extension Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: extension-artifacts
          path: dist-extension/*.zip
          if-no-files-found: error

  # ==============================================================
  # 4. Publish Unified GitHub Release
  # ==============================================================
  publish-release:
    name: Publish Release to GitHub
    needs: [build-desktop, build-mobile, build-extension]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Desktop Artifacts
        uses: actions/download-artifact@v4
        with:
          name: desktop-artifacts
          path: release-assets/desktop

      - name: Download Mobile Artifacts
        uses: actions/download-artifact@v4
        with:
          name: mobile-artifacts
          path: release-assets/mobile

      - name: Download Extension Artifacts
        uses: actions/download-artifact@v4
        with:
          name: extension-artifacts
          path: release-assets/extension

      - name: Compute Checksums & Structure Assets
        run: |
          mkdir -p release-files
          cp release-assets/desktop/*.exe release-files/ || true
          cp release-assets/desktop/latest.yml release-files/ || true
          cp release-assets/desktop/*.blockmap release-files/ || true
          cp release-assets/mobile/*.apk release-files/ || true
          cp release-assets/extension/*.zip release-files/ || true

          cd release-files
          sha256sum * > SHA256SUMS.txt 2>/dev/null || true
          echo "Generated SHA256 checksums:"
          cat SHA256SUMS.txt

      - name: Determine Release Tag
        id: get_tag
        run: |
          TAG="${{ github.event.inputs.tag_name || github.ref_name }}"
          if [ -z "$TAG" ] || [ "$TAG" = "main" ] || [ "$TAG" = "master" ]; then
            TAG="v1.0.0"
          fi
          echo "release_tag=$TAG" >> $GITHUB_OUTPUT

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_tag.outputs.release_tag }}
          name: "GRabbit ${{ steps.get_tag.outputs.release_tag }}"
          draft: ${{ github.event.inputs.draft || false }}
          prerelease: ${{ github.event.inputs.prerelease || false }}
          generate_release_notes: true
          files: |
            release-files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

