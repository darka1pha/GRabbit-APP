<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GRabbit</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="popup-container">
    <header class="header">
      <div class="brand">
        <span class="logo">🐰</span>
        <div class="brand-info">
          <h1>GRabbit</h1>
          <span class="subtitle">Download Companion</span>
        </div>
      </div>
      <div id="connectionStatus" class="status-pill status-loading">
        <span class="dot"></span>
        <span class="status-text">Connecting…</span>
      </div>
    </header>

    <div id="offlinePrompt" class="offline-prompt" style="display: none;">
      <span>GRabbit Desktop is offline.</span>
      <button id="launchDesktopBtn" class="btn primary sm">Launch GRabbit</button>
    </div>

    <div class="quick-add">
      <div class="input-group">
        <input type="text" id="urlInput" placeholder="Paste link to download…" spellcheck="false" />
        <button id="addBtn" class="btn primary">Grab</button>
      </div>
      <div id="quickAddMessage" class="message-banner" style="display: none;"></div>
    </div>

    <div class="quick-settings">
      <label class="toggle-row">
        <span>Intercept browser downloads</span>
        <input type="checkbox" id="interceptToggle" />
      </label>
      <label class="toggle-row">
        <span>Video sniffer button</span>
        <input type="checkbox" id="snifferToggle" />
      </label>
      <label class="toggle-row" id="siteExcludeRow" style="display: none;">
        <span>Never capture on this site (<b id="currentSiteDomain"></b>)</span>
        <input type="checkbox" id="siteExcludeToggle" />
      </label>
      <div class="setting-row">
        <span>Min file size</span>
        <select id="minSizeSelect" class="select-sm">
          <option value="0">All files (0 MB)</option>
          <option value="5">5 MB</option>
          <option value="20">20 MB</option>
          <option value="50">50 MB</option>
          <option value="100">100 MB</option>
        </select>
      </div>
      <div class="bypass-hint">
        💡 Tip: Hold <kbd>Alt</kbd> while clicking a link to bypass GRabbit.
      </div>
    </div>

    <div class="media-section">
      <div class="section-title">
        <span>Media on this Page</span>
        <span id="mediaCount" class="badge">0</span>
      </div>
      <div id="mediaList" class="media-list">
        <div class="empty-state">No media streams detected on this tab.</div>
      </div>
    </div>

    <div id="updateBanner" class="update-banner" style="display: none;">
      <div class="update-info">
        <span id="updateText" class="update-text"></span>
      </div>
      <div class="update-actions">
        <button id="downloadUpdateBtn" class="btn primary sm" style="display: none;">Download</button>
        <button id="reloadExtBtn" class="btn secondary sm">Reload</button>
      </div>
    </div>

    <footer class="footer">
      <button id="optionsBtn" class="btn text">Options & Rules</button>
      <div class="footer-right">
        <button id="updateBtn" class="btn update-btn" title="Check for updates or reload extension">↻ Update</button>
        <span id="versionText" class="version">v1.2.0</span>
      </div>
    </footer>
  </div>
  <script type="module" src="index.js"></script>
</body>
</html>
